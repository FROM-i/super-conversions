name: Build & Release

# Releases are cut automatically when package.json's version changes on main
# (npm run release:patch does that). A pushed v* tag or a manual run also works.
# If a release for the current version already exists, nothing is rebuilt.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> $GITHUB_OUTPUT
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$V" ]]; then
            echo "::error::태그($GITHUB_REF_NAME)와 package.json 버전(v$V)이 다릅니다."; exit 1
          fi
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> $GITHUB_OUTPUT
            echo "v$V 릴리스가 이미 있어 건너뜁니다."
          else
            echo "release=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build app
        run: npx electron-vite build

      # ---- macOS signing/notarization: active only when the secrets exist ----
      - name: macOS signing env
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV
            echo "SC_NOTARIZE=false" >> $GITHUB_ENV
            echo "::warning::Mac 서명 인증서가 없어 서명 없이 빌드합니다 (첫 실행 시 우클릭 › 열기 필요)."
          else
            echo "SC_NOTARIZE=true" >> $GITHUB_ENV
          fi

      - name: Package (${{ runner.os }})
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PUBLISH=always
          if [ "$RUNNER_OS" == "macOS" ]; then
            npx electron-builder --mac --publish $PUBLISH -c.mac.notarize=${SC_NOTARIZE:-false}
          else
            npx electron-builder --win --publish $PUBLISH
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.yml
          if-no-files-found: ignore
