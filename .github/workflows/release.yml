name: Build & Release

# Releases are cut automatically when package.json's version changes on main
# (npm run release:patch does that). A pushed v* tag or a manual run also works.
# Flow: check (is vX.Y.Z already complete?) → build on Windows + macOS → publish once.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> $GITHUB_OUTPUT
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$V" ]]; then
            echo "::error::태그($GITHUB_REF_NAME)와 package.json 버전(v$V)이 다릅니다."; exit 1
          fi
          ASSETS=$(gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]] \
             && echo "$ASSETS" | grep -q '\.exe$' && echo "$ASSETS" | grep -q '\.dmg$' \
             && echo "$ASSETS" | grep -qx 'latest.yml' && echo "$ASSETS" | grep -qx 'latest-mac.yml'; then
            echo "release=false" >> $GITHUB_OUTPUT
            echo "v$V 릴리스가 이미 완성되어 있어 건너뜁니다."
          else
            echo "release=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build app
        run: npx electron-vite build

      # ---- macOS signing/notarization: active only when the secrets exist ----
      - name: macOS signing env
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV
            echo "SC_NOTARIZE=false" >> $GITHUB_ENV
            echo "::warning::Mac 서명 인증서가 없어 서명 없이 빌드합니다 (첫 실행 시 우클릭 › 열기 필요)."
          else
            echo "SC_NOTARIZE=true" >> $GITHUB_ENV
          fi

      - name: Package (${{ runner.os }})
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" == "macOS" ]; then
            CMD="npx electron-builder --mac --publish never -c.mac.notarize=${SC_NOTARIZE:-false}"
          else
            CMD="npx electron-builder --win --publish never"
          fi
          if ! $CMD 2>&1 | tee build.log; then
            # surface the failure as annotations (readable without log access)
            tail -n 25 build.log | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.check.outputs.version }}
        run: |
          ls -la out
          # release notes = this version's section of CHANGELOG.md
          awk -v h="## v$V" 'index($0,h)==1{f=1;next} /^## v/{if(f)exit} f' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "Super Conversions v$V" > notes.md
          printf '\n---\n**설치:** Windows → `SuperConversions-Setup-*.exe` · macOS(Apple Silicon) → `SuperConversions-*-arm64.dmg`\n이미 설치된 앱은 자동으로 업데이트됩니다.\n' >> notes.md
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release edit "v$V" --title "v$V" --notes-file notes.md --draft=false
          else
            gh release create "v$V" --target "$GITHUB_SHA" --title "v$V" --notes-file notes.md
          fi
          gh release upload "v$V" out/* --clobber
